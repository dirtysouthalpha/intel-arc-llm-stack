      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="897" height="295" rx="12" fill="#12121A" stroke="url(#edge)" stroke-width="1.5" stroke-opacity="0.55"/>
  <rect x="1.5" y="1.5" width="897" height="38" rx="12" fill="#1b1b26"/>
  <rect x="1.5" y="26" width="897" height="14" fill="#1b1b26"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/><circle cx="48" cy="20" r="6" fill="#ffbd2e"/><circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#6B7280" text-anchor="middle">intel-arc-llm-stack — gateway model aliases</text>
  <text x="28" y="64" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" opacity="0"><tspan fill="#22D3EE" font-weight="700">❯</tspan><tspan fill="#6B7280"> ~ </tspan><tspan fill="#E8E8F0">curl -s http://&lt;host&gt;:4000/v1/models | jq -r &#x27;.data[].id&#x27;</tspan><animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.12s" fill="freeze"/></text><text x="28" y="90" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#E8E8F0" font-weight="400" opacity="0">local-chat<animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.18s" fill="freeze"/></text><text x="28" y="116" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#E8E8F0" font-weight="400" opacity="0">local-vision<animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.18s" fill="freeze"/></text><text x="28" y="142" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#E8E8F0" font-weight="400" opacity="0">gemma-12b-max<animate attributeName="opacity" from="0" to="1" begin="1.65s" dur="0.18s" fill="freeze"/></text><text x="28" y="168" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#E8E8F0" font-weight="400" opacity="0">qwen3-30b<animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.18s" fill="freeze"/></text><text x="28" y="194" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#E8E8F0" font-weight="400" opacity="0">omni<animate attributeName="opacity" from="0" to="1" begin="2.75s" dur="0.18s" fill="freeze"/></text><text x="28" y="220" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" fill="#6B7280" font-weight="400" opacity="0"># one OpenAI-compatible endpoint · models hot-swap on demand<animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.18s" fill="freeze"/></text><text x="28" y="246" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15.5" opacity="0"><tspan fill="#22D3EE" font-weight="700">❯</tspan><tspan fill="#6B7280"> ~ </tspan><tspan fill="#E8E8F0"></tspan><animate attributeName="opacity" from="0" to="1" begin="3.85s" dur="0.12s" fill="freeze"/></text><rect x="28" y="233" width="9" height="17" fill="#22D3EE" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.15s" dur="0.15s" fill="freeze"/><animate attributeName="opacity" values="1;1;0;0;1" dur="1s" begin="4.45s" repeatCount="indefinite"/></rect>
</svg>
