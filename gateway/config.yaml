# LiteLLM gateway — one OpenAI-compatible endpoint for the whole stack.
# Local-first cost policy: everyday + vision -> B60 ($0); coding/orchestration -> paid (opt-in).
# Run: litellm --config config.yaml --host 0.0.0.0 --port 4000
#   (bind reachable over Tailscale at 100.70.240.55:4000)

model_list:
  # ---- Local, free: served by IPEX-LLM Ollama on the Arc B60 (port 11500) ----
  - model_name: local-chat            # default everyday brain
    litellm_params:
      model: openai/gemma3-12b-max
      api_base: http://127.0.0.1:11500/v1
      api_key: "ollama"
  - model_name: local-vision          # Hermes' eyes (Gemma 3 is multimodal)
    litellm_params:
      model: openai/gemma3-12b-max
      api_base: http://127.0.0.1:11500/v1
      api_key: "ollama"
  - model_name: gemma-12b-max
    litellm_params:
      model: openai/gemma3-12b-max
      api_base: http://127.0.0.1:11500/v1
      api_key: "ollama"
  - model_name: gemma-27b-max
    litellm_params:
      model: openai/gemma3-27b-max
      api_base: http://127.0.0.1:11500/v1
      api_key: "ollama"
  # ---- High-throughput local tier: vLLM XPU on the B60 (port 8001), added in Phase 3 ----
  - model_name: gpt-oss-20b
    litellm_params:
      model: openai/gpt-oss-20b
      api_base: http://127.0.0.1:8001/v1
      api_key: "vllm"

  # ---- Paid, opt-in: only used when the caller explicitly asks for these aliases ----
  - model_name: coding
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: orchestration
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  # Anything that fails or is unspecified stays local + free.
  default_fallbacks: ["local-chat"]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
