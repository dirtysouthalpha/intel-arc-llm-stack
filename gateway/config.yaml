# LiteLLM gateway — one OpenAI-compatible endpoint for the whole stack.
# Local-first cost policy: everyday + vision -> B60 ($0); coding/orchestration -> paid (opt-in).
# Run: litellm --config config.yaml --host 0.0.0.0 --port 4000
#   (bind reachable over Tailscale at 100.70.240.55:4000)

model_list:
  # ---- Local, free: served by llama-swap on the Arc B60 (port 9090) ----
  # llama-swap loads/swaps the model named below on demand.
  - model_name: local-chat            # default everyday brain (64K, fast)
    litellm_params:
      model: openai/gemma3-12b
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"
  - model_name: local-vision          # Hermes' eyes (Gemma 3 multimodal) — added with mmproj
    litellm_params:
      model: openai/gemma3-12b
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"
  - model_name: gemma-12b            # 64K balanced
    litellm_params:
      model: openai/gemma3-12b
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"
  - model_name: gemma-12b-max        # full 128K context
    litellm_params:
      model: openai/gemma3-12b-max
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"

  # ---- Paid, opt-in: only used when the caller explicitly asks for these aliases ----
  - model_name: coding
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: orchestration
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  # Anything that fails or is unspecified stays local + free.
  default_fallbacks: ["local-chat"]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
