# LiteLLM gateway - one OpenAI-compatible endpoint for the whole stack.
# Local-first cost policy: everyday + vision -> B60 ($0); coding/orchestration -> paid (opt-in).
# Run: litellm --config config.yaml --host 0.0.0.0 --port 4000
# (ASCII only - LiteLLM reads this YAML with the Windows cp1252 codec.)

model_list:
  # ---- Local, free: served by llama-swap on the Arc B60 (port 9090) ----
  - model_name: local-chat
    litellm_params:
      model: openai/gemma3-12b
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"
  - model_name: local-vision
    litellm_params:
      model: openai/gemma3-12b-vision
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"
  - model_name: gemma-12b
    litellm_params:
      model: openai/gemma3-12b
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"
  - model_name: gemma-12b-max
    litellm_params:
      model: openai/gemma3-12b-max
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"
  - model_name: gemma-27b
    litellm_params:
      model: openai/gemma3-27b
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"
  - model_name: gemma-27b-vision
    litellm_params:
      model: openai/gemma3-27b-vision
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"

  - model_name: qwen3-30b
    litellm_params:
      model: openai/qwen3-30b
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"
  - model_name: local-coding
    litellm_params:
      model: openai/qwen2.5-coder-32b
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"
  - model_name: qwen2.5-vl
    litellm_params:
      model: openai/qwen2.5-vl-7b
      api_base: http://127.0.0.1:9090/v1
      api_key: "swap"

  # ---- Paid, opt-in: used only when the caller explicitly asks for these aliases ----
  - model_name: coding
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: orchestration
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  default_fallbacks: ["local-chat"]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
