# llama-swap config — multi-model serving on the Arc B60 behind one OpenAI endpoint.
# llama-swap loads/unloads a model on demand (only one big model fits in 24GB at a time).
# Env (ONEAPI_DEVICE_SELECTOR etc.) is inherited from the start-swap.ps1 launcher.
# NOTE for this IPEX SYCL build: no flash-attn, no KV quant (both crash). f16 KV + small -ub.
# Newer archs (gpt-oss, Qwen3-VL) run on the MAINLINE VULKAN binary (llama-cpp-vulkan), which
# enumerates only the Arc and DOES support flash-attention.

healthCheckTimeout: 300

models:
  # Balanced daily driver: 64K context, larger ubatch for fast prompt ingestion.
  "gemma3-12b":
    cmd: >
      V:\AI\llama-cpp\llama-server.exe
      -m V:\AI\models\gemma-3-12b-it-Q4_K_M.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 65536 -ub 256 -b 1024 -np 1 --no-mmap
    ttl: 1800

  # Max context: full 128K. Small ubatch to fit the compute buffer; slower long-prompt ingest.
  "gemma3-12b-max":
    cmd: >
      V:\AI\llama-cpp\llama-server.exe
      -m V:\AI\models\gemma-3-12b-it-Q4_K_M.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 131072 -ub 64 -b 256 -np 1 --no-mmap
    ttl: 1800

  # Vision: Gemma 3 multimodal (text + image) via the mmproj projector. For Hermes' screenshots.
  "gemma3-12b-vision":
    cmd: >
      V:\AI\llama-cpp\llama-server.exe
      -m V:\AI\models\gemma-3-12b-it-Q4_K_M.gguf
      --mmproj V:\AI\models\gemma-3-12b-mmproj-f16.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 32768 -ub 256 -b 1024 -np 1 --no-mmap
    ttl: 1800

  # Gemma 3 27B (Q4, ~15.8GB weights). f16 KV + small ub to fit 24GB. 32K context.
  "gemma3-27b":
    cmd: >
      V:\AI\llama-cpp\llama-server.exe
      -m V:\AI\models\gemma-3-27b-it-Q4_K_M.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 32768 -ub 64 -b 256 -np 1 --no-mmap
    ttl: 1800

  "gemma3-27b-vision":
    cmd: >
      V:\AI\llama-cpp\llama-server.exe
      -m V:\AI\models\gemma-3-27b-it-Q4_K_M.gguf
      --mmproj V:\AI\models\gemma-3-27b-mmproj-f16.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 16384 -ub 64 -b 256 -np 1 --no-mmap
    ttl: 1800

  # Qwen3-30B-A3B MoE (3B active) - fast, strong tools. Q4 ~18GB.
  "qwen3-30b":
    cmd: >
      V:\AI\llama-cpp\llama-server.exe
      -m V:\AI\models\Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 32768 -ub 256 -b 1024 -np 1 --no-mmap
    ttl: 1800

  # Qwen2.5-Coder-32B - local coding. Q4 ~20GB -> tight, smaller context.
  "qwen2.5-coder-32b":
    cmd: >
      V:\AI\llama-cpp\llama-server.exe
      -m V:\AI\models\Qwen2.5-Coder-32B-Instruct-Q4_K_M.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 16384 -ub 64 -b 256 -np 1 --no-mmap
    ttl: 1800

  # Qwen2.5-VL-7B - vision + tools, small/fast.
  "qwen2.5-vl-7b":
    cmd: >
      V:\AI\llama-cpp\llama-server.exe
      -m V:\AI\models\Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
      --mmproj V:\AI\models\Qwen2.5-VL-7B-mmproj-F16.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 32768 -ub 256 -b 1024 -np 1 --no-mmap
    ttl: 1800

  # gpt-oss-20b (MoE, MXFP4 ~12GB) on the MAINLINE VULKAN binary (newer arch + flash-attn).
  "gpt-oss-20b":
    cmd: >
      V:\AI\llama-cpp-vulkan\llama-server.exe
      -m V:\AI\models\gpt-oss-20b-mxfp4.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 16384 --jinja -np 1 --no-mmap
    ttl: 1800

  # Qwen3-VL-8B - newer vision-language (mainline Vulkan binary).
  "qwen3-vl-8b":
    cmd: >
      V:\AI\llama-cpp-vulkan\llama-server.exe
      -m V:\AI\models\Qwen3-VL-8B-Instruct-Q4_K_M.gguf
      --mmproj V:\AI\models\Qwen3-VL-8B-mmproj-F16.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 32768 -fit off -np 1 --no-mmap
    ttl: 1800

  # Qwen2.5-Omni-7B - text + image + AUDIO + video (mainline Vulkan binary + audio-capable mmproj).
  "qwen2.5-omni":
    cmd: >
      V:\AI\llama-cpp-vulkan\llama-server.exe
      -m V:\AI\models\Qwen2.5-Omni-7B-Q4_K_M.gguf
      --mmproj V:\AI\models\Qwen2.5-Omni-7B-mmproj-f16.gguf
      -ngl 999 --host 127.0.0.1 --port ${PORT}
      -c 32768 -np 1 --no-mmap
    ttl: 1800
